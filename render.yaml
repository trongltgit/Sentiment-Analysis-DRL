# render.yaml — Professional Financial Sentiment Analysis v2.0
services:
  - type: web
    name: finsentiment-ai
    runtime: docker
    plan: standard
    region: singapore
    healthCheckPath: /api/v1/health
    dockerBuildArgs:
      - CACHEBUST=20
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEY_DRL
        sync: false   # Set manually in Render dashboard (free key from console.groq.com)
