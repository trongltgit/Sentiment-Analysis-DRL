# File: render.yaml
services:
  - type: web
    name: sentiment-analysis-drl
    runtime: docker
    plan: standard
    region: singapore
    healthCheckPath: /api/v1/health
    # ✅ Truyền CACHEBUST từ Render env → Docker ARG → buộc rebuild
    dockerBuildArgs:
      - CACHEBUST=10
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
